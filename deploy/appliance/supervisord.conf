[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:postgresql]
command=/usr/bin/postgres -D /var/lib/pgsql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql_err.log

[program:opensearch]
command=/opt/opensearch/bin/opensearch
user=opensearch
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/opensearch.log
stderr_logfile=/var/log/opensearch_err.log

[program:karaoke-api]
directory=/opt/karaoke
command=/opt/karaoke/.venv/bin/python -m uvicorn karaoke.api:app --host 0.0.0.0 --port 8000
user=root
autostart=true
autorestart=true
priority=30
environment=KARAOKE_PG_URL="postgresql://karaoke:karaoke@localhost:5432/karaoke",OPENSEARCH_URL="http://localhost:9200",PYTHONPATH="/opt/karaoke/src"
stdout_logfile=/var/log/karaoke_api.log
stderr_logfile=/var/log/karaoke_api_err.log

[program:karaoke-mcp]
directory=/opt/karaoke
command=/opt/karaoke/.venv/bin/python -m karaoke.mcp_server --host 0.0.0.0 --port 8888
user=root
autostart=true
autorestart=true
priority=40
environment=KARAOKE_PG_URL="postgresql://karaoke:karaoke@localhost:5432/karaoke",OPENSEARCH_URL="http://localhost:9200",PYTHONPATH="/opt/karaoke/src"
stdout_logfile=/var/log/karaoke_mcp.log
stderr_logfile=/var/log/karaoke_mcp_err.log
