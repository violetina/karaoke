apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: karaoke
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: karaoke
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: karaoke
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: karaoke
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: karaoke
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30567
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30156
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
