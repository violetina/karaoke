apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sensor-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-sensor-jobs
  namespace: argo-events
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-sensor-jobs
  namespace: argo-events
subjects:
  - kind: ServiceAccount
    name: argo-events-sensor-sa
    namespace: argo-events
roleRef:
  kind: Role
  name: argo-events-sensor-jobs
  apiGroup: rbac.authorization.k8s.io
