apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: celery-postprocess-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: argo-events-sensor-sa
  dependencies:
    - name: celery-task-event
      eventSourceName: amqp-celery-eventsource
      eventName: taskEvents
      filters:
        data:
          - path: body.name
            type: string
            value:
              - "karaoke.tasks.*"
  triggers:
    # Index every succeeded karaoke Celery task into an OpenSearch
    # `karaoke-events` document. This is the real side effect: the cluster
    # cannot reach the host control API (it binds 127.0.0.1), but BOTH the
    # cluster and the host can reach OpenSearch — the cluster via its service
    # DNS here, the host via the NodePort at localhost:9200. So OpenSearch is
    # the shared event ledger: the host TUI / web UI polls it (see the
    # ctrl-api /api/events/recent endpoint) and refreshes the finished track
    # in place, without a full page reload that would kill in-process work.
    #
    # The document id is the Celery task uuid, so a redelivered event upserts
    # the same row rather than duplicating it.
    - template:
        name: index-task-event-opensearch
        http:
          url: http://opensearch-cluster-master.default.svc.cluster.local:9200/karaoke-events/_doc/
          method: POST
          headers:
            Content-Type: application/json
          payload:
            - src:
                dependencyName: celery-task-event
                dataKey: body.uuid
              dest: task_id
            - src:
                dependencyName: celery-task-event
                dataKey: body.name
              dest: task_name
            - src:
                dependencyName: celery-task-event
                dataKey: body.state
              dest: state
            - src:
                dependencyName: celery-task-event
                dataKey: body.timestamp
              dest: ts
            - src:
                dependencyName: celery-task-event
                dataKey: body
              dest: raw
        retryStrategy:
          steps: 3
          duration: 3s
          factor: 2
