apiVersion: v1
kind: Service
metadata:
  name: karaoke-api
  namespace: karaoke
  labels:
    app.kubernetes.io/name: karaoke-api
    app.kubernetes.io/part-of: karaoke
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: karaoke-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Mapped to localhost:8080 by deploy/kind-cluster.yaml extraPortMappings.
      nodePort: 30800
