[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.1.0"
description = "Local karaoke + lyric semantic search over OpenSearch (kind cluster), LRCLIB synced lyrics."
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "mutagen>=1.47",
    "faster-whisper>=1.2",
    "requests>=2.32",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]
spotify = ["spotipy>=2.24"]
beats = ["librosa>=0.10", "soundfile>=0.12"]
youtube = ["yt-dlp>=2024.0"]

[project.scripts]
karaoke = "karaoke.cli:karaoke_main"
karaoke-yt = "karaoke.cli:karaoke_yt_main"
lyricsearch = "karaoke.cli:lyricsearch_main"
music-index = "karaoke.cli:index_main"
karaoke-stats = "karaoke.cli:stats_main"
karaoke-stage = "karaoke.cli:stage_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["karaoke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
