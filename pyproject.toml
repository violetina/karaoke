[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.5.0"
description = "Local karaoke + lyric semantic search over OpenSearch (kind cluster), LRCLIB synced lyrics."
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "mutagen>=1.47",
    "faster-whisper>=1.2",
    "requests>=2.32",
    "rich>=13.7",
    "beautifulsoup4",
    "duckduckgo-search",
    "textual",
    "pyfiglet>=1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pika",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]
spotify = ["spotipy>=2.24"]
beats = ["librosa>=0.10", "soundfile>=0.12"]
youtube = ["yt-dlp>=2024.0"]

[project.scripts]
karaoke = "karaoke.cli:karaoke_main"
karaoke-yt = "karaoke.cli:karaoke_yt_main"
lyricsearch = "karaoke.cli:lyricsearch_main"
music-index = "karaoke.cli:index_main"
karaoke-stage = "karaoke.cli:stage_main"
karaoke-player = "karaoke.cli:player_main"
karaoke-backfill = "karaoke.cli:backfill_main"
karaoke-browse = "karaoke.cli:browse_main"
karaoke-api = "karaoke.api:main"
karaoke-ctrl-api = "karaoke.ctrl_api:main"
karaoke-vector-index = "karaoke.vector_index:vector_index_main"
karaoke-tui = "karaoke.cli:tui_main"
karaoke-analyze = "karaoke.cli:analyze_main"
karaoke-upgrade-timings = "karaoke.upgrade_timings:upgrade_main"
karaoke-postprocess-worker = "karaoke.postprocess_worker:main"
karaoke-spotify-playlist = "karaoke.spotify_playlist:playlist_main"
karaoke-find-sources = "karaoke.find_sources:find_sources_main"
karaoke-sample = "karaoke.sample_audio:sample_main"
karaoke-smartlist = "karaoke.smartlist:smartlist_main"
karaoke-recording = "karaoke.recording_worker:recording_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["karaoke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
